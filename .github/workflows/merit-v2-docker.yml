name: MERIT v2 Docker
on:
  push:
    branches: [main, merit-v2-docker-20261105]
    paths: ['docker/merit-v2/**', '.github/workflows/merit-v2-docker.yml']
    tags: ['v2-live-*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/merit-v2/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/biosystemengineeringlab-iitb/merit-ml:v2-live-20261105
          cache-from: type=gha
          cache-to: type=gha,mode=max
